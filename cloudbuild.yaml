steps:
  # Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/studio-ops-copilot:$COMMIT_SHA', '.']

  # Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/studio-ops-copilot:$COMMIT_SHA']

  # Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'studio-ops-copilot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/studio-ops-copilot:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GEMINI_MODEL=gemini-2.5-flash'

images:
  - 'gcr.io/$PROJECT_ID/studio-ops-copilot:$COMMIT_SHA'
